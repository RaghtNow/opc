version: '3.8'

# 测试环境 Docker Compose
# 端口规则：测试环境 = 生产环境端口 + 1
# 后续新应用端口分配必须间隔，不能连续

services:
  json-parser:
    image: crpi-7lyodabocu0g6i1q.cn-beijing.personal.cr.aliyuncs.com/kdqg/opc-json-parser:dev-latest
    container_name: opc-json-parser-dev
    ports:
      - "8082:80"
    restart: unless-stopped
    labels:
      - "com.opc.service=json-parser"
      - "com.opc.env=dev"
    networks:
      - opc-network-dev

  json-editor:
    image: crpi-7lyodabocu0g6i1q.cn-beijing.personal.cr.aliyuncs.com/kdqg/opc-json-editor:dev-latest
    container_name: opc-json-editor-dev
    ports:
      - "8084:80"
    restart: unless-stopped
    labels:
      - "com.opc.service=json-editor"
      - "com.opc.env=dev"
    networks:
      - opc-network-dev

  nginx:
    image: nginx:alpine
    container_name: opc-nginx-dev
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - json-parser
      - json-editor
    restart: unless-stopped
    networks:
      - opc-network-dev

networks:
  opc-network-dev:
    external: true

volumes:
  ssl-certs:
