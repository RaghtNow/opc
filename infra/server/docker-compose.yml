version: '3.8'

services:
  json-parser:
    image: crpi-7lyodabocu0g6i1q.cn-beijing.personal.cr.aliyuncs.com/kdqg/opc-json-parser:latest
    container_name: opc-json-parser
    ports:
      - "8081:80"
    restart: unless-stopped
    labels:
      - "com.opc.service=json-parser"
    networks:
      - opc-network

  json-editor:
    image: crpi-7lyodabocu0g6i1q.cn-beijing.personal.cr.aliyuncs.com/kdqg/opc-json-editor:latest
    container_name: opc-json-editor
    ports:
      - "8083:80"
    restart: unless-stopped
    labels:
      - "com.opc.service=json-editor"
    networks:
      - opc-network

  edu-insight-teacher:
    image: crpi-7lyodabocu0g6i1q.cn-beijing.personal.cr.aliyuncs.com/kdqg/opc-edu-insight-teacher:latest
    container_name: opc-edu-insight-teacher
    ports:
      - "8085:80"
    restart: unless-stopped
    depends_on:
      - edu-insight-api
    labels:
      - "com.opc.service=edu-insight-teacher"
    networks:
      - opc-network

  edu-insight-api:
    image: crpi-7lyodabocu0g6i1q.cn-beijing.personal.cr.aliyuncs.com/kdqg/opc-edu-insight-api:latest
    container_name: opc-edu-insight-api
    ports:
      - "8087:8088"
    restart: unless-stopped
    labels:
      - "com.opc.service=edu-insight-api"
    networks:
      - opc-network

  nginx:
    image: nginx:alpine
    container_name: opc-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - json-parser
      - json-editor
      - edu-insight-teacher
      - edu-insight-api
    restart: unless-stopped
    networks:
      - opc-network

networks:
  opc-network:
    external: true

volumes:
  ssl-certs:
