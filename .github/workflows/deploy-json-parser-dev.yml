name: Deploy JSON Parser (Dev)

on:
  workflow_run:
    workflows: ["Build & Push JSON Parser"]
    types:
      - completed
    branches: [dev]
  workflow_dispatch:

env:
  REGISTRY: crpi-7lyodabocu0g6i1q.cn-beijing.personal.cr.aliyuncs.com
  NAMESPACE: kdqg
  REPOSITORY: opc-json-parser

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to dev server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p /opt/opc-dev
            cd /opt/opc-dev

            # 更新 docker-compose.dev.yml
            cat > docker-compose.dev.yml << 'EOF'
            version: '3.8'

            services:
              json-parser:
                image: crpi-7lyodabocu0g6i1q.cn-beijing.personal.cr.aliyuncs.com/kdqg/opc-json-parser:dev-latest
                container_name: opc-json-parser-dev
                ports:
                  - "8082:80"
                restart: unless-stopped
                labels:
                  - "com.opc.service=json-parser"
                  - "com.opc.env=dev"
                networks:
                  - opc-network-dev

              json-editor:
                image: crpi-7lyodabocu0g6i1q.cn-beijing.personal.cr.aliyuncs.com/kdqg/opc-json-editor:dev-latest
                container_name: opc-json-editor-dev
                ports:
                  - "8084:80"
                restart: unless-stopped
                labels:
                  - "com.opc.service=json-editor"
                  - "com.opc.env=dev"
                networks:
                  - opc-network-dev

            networks:
              opc-network-dev:
                external: true
            EOF

            docker network create opc-network-dev 2>/dev/null || echo "网络已存在"
            docker compose -f docker-compose.dev.yml pull json-parser
            docker compose -f docker-compose.dev.yml up -d json-parser
            docker image prune -f

      - name: Notify deployment
        run: |
          echo "✅ Dev environment deployed successfully!"
          echo "Image: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.REPOSITORY }}:dev-latest"
          echo "Port: 8082"
