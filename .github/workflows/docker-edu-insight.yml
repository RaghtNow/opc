name: Build & Deploy edu-insight

on:
  push:
    branches: [main, master, dev]
    tags: ['v*']
    paths:
      - 'apps/edu-insight-teacher/**'
      - 'apps/edu-insight-api/**'
      - '.github/workflows/docker-edu-insight.yml'
      - 'infra/**'
  pull_request:
    branches: [main, master, dev]
    paths:
      - 'apps/edu-insight-teacher/**'
      - 'apps/edu-insight-api/**'
      - '.github/workflows/docker-edu-insight.yml'
      - 'infra/**'
  workflow_dispatch:

env:
  REGISTRY: crpi-7lyodabocu0g6i1q.cn-beijing.personal.cr.aliyuncs.com
  NAMESPACE: kdqg
  DEV_API_BASE: http://127.0.0.1:8088/api
  PROD_API_BASE: http://127.0.0.1:8087/api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: teacher
            repository: opc-edu-insight-teacher
            context: apps/edu-insight-teacher
          - name: api
            repository: opc-edu-insight-api
            context: apps/edu-insight-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Extract metadata (dev branch)
        id: meta-dev
        if: github.ref == 'refs/heads/dev'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.app.repository }}
          tags: |
            type=sha,prefix=dev-,suffix=,format=short
            type=raw,value=dev-latest

      - name: Extract metadata (main/master/tags)
        id: meta-main
        if: github.ref != 'refs/heads/dev'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.app.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.app.context }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-dev.outputs.tags || steps.meta-main.outputs.tags }}
          labels: ${{ steps.meta-dev.outputs.labels || steps.meta-main.outputs.labels }}
          build-args: |
            VITE_EDU_INSIGHT_API_BASE=${{ github.ref == 'refs/heads/dev' && env.DEV_API_BASE || env.PROD_API_BASE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  deploy-dev:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
    steps:
      - name: Deploy to dev server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p /opt/opc-dev
            cd /opt/opc-dev

            cat > docker-compose.dev.yml << 'EOF'
            version: '3.8'

            services:
              json-parser:
                image: crpi-7lyodabocu0g6i1q.cn-beijing.personal.cr.aliyuncs.com/kdqg/opc-json-parser:dev-latest
                container_name: opc-json-parser-dev
                ports:
                  - "8082:80"
                restart: unless-stopped
                networks:
                  - opc-network-dev

              json-editor:
                image: crpi-7lyodabocu0g6i1q.cn-beijing.personal.cr.aliyuncs.com/kdqg/opc-json-editor:dev-latest
                container_name: opc-json-editor-dev
                ports:
                  - "8084:80"
                restart: unless-stopped
                networks:
                  - opc-network-dev

              edu-insight-teacher:
                image: crpi-7lyodabocu0g6i1q.cn-beijing.personal.cr.aliyuncs.com/kdqg/opc-edu-insight-teacher:dev-latest
                container_name: opc-edu-insight-teacher-dev
                ports:
                  - "8086:80"
                restart: unless-stopped
                depends_on:
                  - edu-insight-api
                networks:
                  - opc-network-dev

              edu-insight-api:
                image: crpi-7lyodabocu0g6i1q.cn-beijing.personal.cr.aliyuncs.com/kdqg/opc-edu-insight-api:dev-latest
                container_name: opc-edu-insight-api-dev
                ports:
                  - "8088:8088"
                restart: unless-stopped
                networks:
                  - opc-network-dev

            networks:
              opc-network-dev:
                external: true
            EOF

            docker network create opc-network-dev 2>/dev/null || echo "网络已存在"
            docker compose -f docker-compose.dev.yml pull edu-insight-teacher edu-insight-api
            docker compose -f docker-compose.dev.yml up -d edu-insight-teacher edu-insight-api
            docker image prune -f

  deploy-prod:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p /opt/opc
            cd /opt/opc

            cat > docker-compose.yml << 'EOF'
            version: '3.8'

            services:
              json-parser:
                image: crpi-7lyodabocu0g6i1q.cn-beijing.personal.cr.aliyuncs.com/kdqg/opc-json-parser:latest
                container_name: opc-json-parser
                ports:
                  - "8081:80"
                restart: unless-stopped
                networks:
                  - opc-network

              json-editor:
                image: crpi-7lyodabocu0g6i1q.cn-beijing.personal.cr.aliyuncs.com/kdqg/opc-json-editor:latest
                container_name: opc-json-editor
                ports:
                  - "8083:80"
                restart: unless-stopped
                networks:
                  - opc-network

              edu-insight-teacher:
                image: crpi-7lyodabocu0g6i1q.cn-beijing.personal.cr.aliyuncs.com/kdqg/opc-edu-insight-teacher:latest
                container_name: opc-edu-insight-teacher
                ports:
                  - "8085:80"
                restart: unless-stopped
                depends_on:
                  - edu-insight-api
                networks:
                  - opc-network

              edu-insight-api:
                image: crpi-7lyodabocu0g6i1q.cn-beijing.personal.cr.aliyuncs.com/kdqg/opc-edu-insight-api:latest
                container_name: opc-edu-insight-api
                ports:
                  - "8087:8088"
                restart: unless-stopped
                networks:
                  - opc-network

            networks:
              opc-network:
                external: true
            EOF

            docker network create opc-network 2>/dev/null || echo "网络已存在"
            docker compose pull edu-insight-teacher edu-insight-api
            docker compose up -d edu-insight-teacher edu-insight-api
            docker image prune -f
